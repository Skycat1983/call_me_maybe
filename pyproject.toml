[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Constrained function calling with a small language model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=1.26",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.11",
    "pytest>=8.0",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }
